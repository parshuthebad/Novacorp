<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaCorp Customer Portal (Practice)</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f6ff;margin:0;padding:24px}
  .card{max-width:480px;margin:auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px #0002}
  h1{font-size:20px;color:#1565c0;margin-top:0}
  label{display:block;margin:12px 0 4px;font-size:14px}
  input{width:100%;padding:8px;border:1px solid #9bb;border-radius:6px;box-sizing:border-box}
  button{margin-top:16px;padding:10px 18px;border:0;border-radius:6px;background:#1565c0;color:#fff;cursor:pointer}
  #msg{margin-top:14px;font-size:14px;min-height:20px}
  .ok{color:#2e7d32}.err{color:#c62828}
  table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}
  td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}
</style>
</head>
<body>
<div class="card">
  <h1>New entry</h1>
  <label for="name">Name</label><input id="name" name="name">
  <label for="email">Email</label><input id="email" name="email">
  <label for="phone">Phone</label><input id="phone" name="phone">
  <button id="save" type="button">Save</button>
  <div id="msg" role="status"></div>
  <table><thead><tr><th>Name</th><th>Email</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script>
  // In-memory only for the page; also try localStorage so duplicates persist across reloads.
  var customers = [];
  try { customers = JSON.parse(localStorage.getItem("novacorp_customers") || "[]"); } catch (e) { customers = []; }

  function render(){
    var tb = document.getElementById("rows"); tb.innerHTML = "";
    customers.forEach(function(c){
      var tr = document.createElement("tr");
      [c.name, c.email].forEach(function(v){ var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
      tb.appendChild(tr);
    });
  }
  function show(text, ok){
    var m = document.getElementById("msg"); m.textContent = text; m.className = ok ? "ok" : "err";
  }
  document.getElementById("save").addEventListener("click", function(){
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    if(!name || !email){ show("Error: Name and Email are required", false); return; }
    var dup = customers.some(function(c){ return c.email.toLowerCase() === email.toLowerCase(); });
    if(dup){ show("Error: Customer already exists", false); return; }
    customers.push({name: name, email: email, phone: phone});
    try { localStorage.setItem("novacorp_customers", JSON.stringify(customers)); } catch (e) {}
    show("Customer saved successfully", true);
    ["name","email","phone"].forEach(function(id){ document.getElementById(id).value = ""; });
    render();
  });
  render();
</script>
</body>
</html>
